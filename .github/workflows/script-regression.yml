# Targeted native regression suite for scripting. Kept separate from packaging and FreeBSD jobs.
name: Script regression tests

on:
  push:
    branches:
      - test/artcraft-effectcraft-binary-817
    paths:
      - "crates/script/**"
      - "crates/engine/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/script-regression.yml"
  pull_request:
    paths:
      - "crates/script/**"
      - "crates/engine/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/script-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: script-regression-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  script-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Rust version
        run: rustc --version
      - name: Run scripting regression suite
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo test --locked -p effectcraft-script
