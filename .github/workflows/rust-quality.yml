# Fork quality gates. Full workspace gate follows CONTRIBUTING.md / AGENTS.md.
name: Rust quality and deterministic coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install project Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy,llvm-tools-preview
          rustup default 1.95.0
          rustc --version
      - name: Foundation timecode tests and edge-case regressions
        run: cargo test --locked -p effectcraft-time
      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Install LLVM coverage driver
        if: matrix.os == 'ubuntu-latest'
        run: cargo +stable install cargo-llvm-cov --locked
      - name: Measure instrumented foundation coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo llvm-cov --locked -p effectcraft-time --lcov --output-path coverage-time.lcov
          cargo llvm-cov report --json --output-path coverage-time.json
      - name: Archive measured coverage
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: effectcraft-time-coverage
          path: |
            coverage-time.lcov
            coverage-time.json
          if-no-files-found: warn

  workspace:
    # Branch pushes use their draft PR check instead of duplicating expensive builds.
    name: Full workspace quality gate (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Install project Rust toolchain and WASM target
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
          rustup default 1.95.0
          rustup target add wasm32-unknown-unknown --toolchain 1.95.0
          rustc --version
      - name: Enforce repository CI contract
        run: cargo run --locked -p xtask -- ci
